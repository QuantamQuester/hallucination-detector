# =============================================================================
# Render Blueprint — hallucination-detector
# =============================================================================
# To deploy: Render Dashboard → New → Blueprint → connect this repo.
# The service auto-deploys on every push to main (CI must pass first).
# Health-check: GET /health → {"status":"ok","model_loaded":true}
# Logs stream to Render's log panel; prediction log lives in /app/logs/
# =============================================================================
services:
  - type: web
    name: hallucination-detector
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
